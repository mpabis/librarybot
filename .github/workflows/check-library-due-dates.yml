name: Check Library Due Dates

on:
  schedule:
    # Run every day at 06:00 UTC, which is 08:00 Stockholm time during summer
    # time and 07:00 Stockholm time during winter time.
    - cron: '0 6 * * *'
  
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-due-dates:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6
      with:
        token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        enablement: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run library due date checker
      env:
        # Library account credentials (set these as GitHub Secrets)
        LIBRARY_USERNAME_1: ${{ secrets.LIBRARY_USERNAME_1 }}
        LIBRARY_PASSWORD_1: ${{ secrets.LIBRARY_PASSWORD_1 }}
        LIBRARY_USERNAME_2: ${{ secrets.LIBRARY_USERNAME_2 }}
        LIBRARY_PASSWORD_2: ${{ secrets.LIBRARY_PASSWORD_2 }}
        
        # Email configuration (set these as GitHub Secrets)
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
        MAILGUN_SENDER_EMAIL: ${{ secrets.MAILGUN_SENDER_EMAIL }}
        MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        
        # Notification settings
        NOTIFY_BEFORE_DUE_DAYS: ${{ vars.NOTIFY_BEFORE_DUE_DAYS || '2' }}
        NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'true' }}

        # Encrypted web report passcode (set this as a GitHub Secret)
        REPORT_PASSPHRASE: ${{ secrets.REPORT_PASSPHRASE }}
      run: |
        python check-due-dates.py
    
    - name: Upload notification artifacts
      if: ${{ vars.UPLOAD_EMAIL_ARTIFACTS == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: email-notifications-${{ github.run_number }}
        path: email_notification_*.txt
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: public

  deploy:
    # Give the uploaded artifact time to become visible and allow deploy-only retries.
    # https://github.com/actions/deploy-pages/issues/451
    needs: check-due-dates
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
